name: image

# Builds the qemu-syborg image and publishes it to ghcr.io/phorepoc/qemu-syborg:
#   push to main   -> :latest + :sha-<short>
#   tag vX.Y.Z     -> :X.Y.Z + :latest + :sha-<short>
#   pull request   -> build + smoke test only
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t phorepoc/qemu-syborg:ci .
      - name: Smoke test
        run: sh tests/smoke.sh phorepoc/qemu-syborg:ci
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="latest sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags ${GITHUB_REF#refs/tags/v}" ;; esac
          for t in $tags; do
            docker tag phorepoc/qemu-syborg:ci "ghcr.io/phorepoc/qemu-syborg:$t"
            docker push "ghcr.io/phorepoc/qemu-syborg:$t"
          done
